# SPDX-License-Identifier: Apache-2.0
#
# Each job runs exactly one justfile recipe. The workflow contains no copy of the
# commands, so a check cannot mean one thing locally and another here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: [build, tests, lint, fmt, licence-headers]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - run: just ${{ matrix.recipe }}

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - run: just cargo-deny

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The rust-version in Cargo.toml is a promise to anyone depending on these
      # crates. A promise nothing checks is a promise that quietly breaks.
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --locked
