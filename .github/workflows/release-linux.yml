# SPDX-License-Identifier: Apache-2.0
#
# Builds the Linux binaries and uploads them as a workflow artifact.
#
# Deliberately does NOT push to the server. Shipping from CI would mean giving a
# workflow an SSH key to a box that runs other people's production services, and
# the artifact can be downloaded and placed by whoever is already trusted with
# that access:
#
#   gh run download --name radar-linux-x86_64 --dir ./dist
#   scp ./dist/radar-serve guardian-vps-tail:/tmp/
#   ssh guardian-vps-tail 'sudo install -m755 /tmp/radar-serve /usr/local/bin/'
#
# See deploy/README.md.
name: release-linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The interface is compiled into radar-serve, so it has to be built before
      # cargo runs. Building it here rather than on the server is what keeps the
      # deploy one file and the box free of a Node toolchain -- and it means the
      # runbook's sha256sum covers the interface, because it is inside the
      # artifact being hashed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # `just web`, not a second copy of what it does.
      #
      # This step used to run `npm ci && npm audit && npm run build` inline,
      # which is the same three commands the recipe runs -- and on 2026-09-04
      # that cost a release. `just web` had just been taught to retry `npm audit`
      # when the registry's advisory endpoint is unreachable, because a
      # vulnerability and an unreachable registry are different answers and the
      # exit code alone does not tell them apart. The `web` job on `main` went
      # green with the retry; this job failed eight minutes later on a 503 from
      # the same endpoint, because the fix landed in the recipe and this file
      # held its own copy.
      #
      # The justfile's header states the rule for CI and this file is the one
      # place that was not following it: a check cannot mean one thing locally
      # and another here if there is only one definition of it.
      - name: Build the interface
        run: just web

      # `RADAR_BUILD_SHA` is read by `option_env!`, so it has to be set for the
      # compile that produces the artifact and nowhere else. A local build has
      # no value and says "unknown", which is true: only a build from a known
      # commit may claim one.
      - name: Build release binaries
        env:
          RADAR_BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --locked -p radar-serve -p radar-cli -p radar-backfill -p radar-signer -p radar-analyst

      - name: Record what was built
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for b in radar-serve radar radar-backfill radar-signer radar-analyst; do
              printf '%s  %s\n' "$(sha256sum "target/release/$b" | cut -d' ' -f1)" "$b"
            done
          } > target/release/BUILD-INFO.txt
          cat target/release/BUILD-INFO.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-linux-x86_64
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/radar-serve
            target/release/radar
            target/release/radar-backfill
            target/release/radar-signer
            target/release/radar-analyst
            target/release/BUILD-INFO.txt
