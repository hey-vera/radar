[package]
name = "radar-research"
description = "Replay: proving a recorded decision reproduces, and saying why when it does not."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# The feature table's file format, and the same versions the store pins:
# a research artifact that E3 reads in full is columnar work, and a second
# parquet version in the tree would be two decoders for one format.
arrow = { version = "59", default-features = false }
blake3.workspace = true
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
radar-asof.workspace = true
radar-store.workspace = true
radar-strategy.workspace = true
# The index's type, which the analyst reads. The consumer owns the shape and
# this crate writes it -- the same split BaseRates uses.
radar-roast.workspace = true
radar-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
radar-risk.workspace = true
# The index's type, so a test can read back what the builder wrote.
radar-roast.workspace = true
tempfile = "3"
