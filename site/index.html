<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cabal Hunter — see the cabal before you buy</title>
    <meta
      name="description"
      content="528,871 pump.fun launches watched. 2.87% ever graduate. A launch block with 10-13 recipients is 10.1x likelier to be bought out instantly than the average launch. Measured, not predicted."
    />
    <link rel="canonical" href="https://cabalhunter.org/" />
    <meta name="theme-color" content="#0b0d12" />

    <!--
      Open Graph and Twitter cards, and they are not optional here.

      This site's entire distribution is people sharing the bot's replies on X.
      A link that previews as a bare URL is a link nobody clicks, and the
      operator console has shipped without these since it was written because
      nobody was ever meant to share it.

      `summary_large_image` rather than `summary`: the card is the first thing
      anybody sees of this product, and it should carry the headline number.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cabal Hunter" />
    <meta property="og:url" content="https://cabalhunter.org/" />
    <meta
      property="og:title"
      content="Cabal Hunter — see the cabal before you buy"
    />
    <meta
      property="og:description"
      content="528,871 pump.fun launches watched. 2.87% ever graduate. Coordination is visible in the launch block, before you buy."
    />
    <meta property="og:image" content="https://cabalhunter.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cabal Hunter: 528,871 launches watched, 2.87% ever graduate."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cabal Hunter — see the cabal before you buy" />
    <meta
      name="twitter:description"
      content="528,871 pump.fun launches watched. 2.87% ever graduate. Coordination is visible in the launch block, before you buy."
    />
    <meta name="twitter:image" content="https://cabalhunter.org/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      The page is a React application, so a reader with JavaScript off, or a
      scraper that does not run it, gets nothing from the div above. This is not
      a courtesy: link unfurlers and search crawlers are exactly the readers this
      product depends on, and telling them nothing while telling a browser
      everything is the kind of gap that goes unnoticed for months.

      Everything below is true and dated, and it is checked by the same test that
      checks the rendered page.
    -->
    <noscript>
      <h1>Cabal Hunter</h1>
      <p>
        Most launches on pump.fun are coordinated, and the coordination is
        visible in the launch block before you buy.
      </p>
      <ul>
        <li>528,871 launches watched, across 121,445 creators.</li>
        <li>2.87% of measured launches ever graduate.</li>
        <li>22.6% show almost no activity at all.</li>
        <li>
          A launch block with 10–13 recipients is 10.1× likelier to be bought
          out instantly than the average launch.
        </li>
      </ul>
      <p>Measured on 2026-09-05. Measured, not predicted. Not financial advice.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
