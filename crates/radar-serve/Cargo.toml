[package]
name = "radar-serve"
description = "Radar's HTTP surface: ops page, JSON API, stateless MCP, and an x402-priced public surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "radar-serve"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
radar-agent.workspace = true
radar-asof.workspace = true
radar-customer.workspace = true
radar-model.workspace = true
radar-instruments.workspace = true
radar-research.workspace = true
radar-risk.workspace = true
ring = { version = "0.17", default-features = false }
thiserror.workspace = true
rust-embed = { version = "8", default-features = false }
radar-store.workspace = true
radar-types.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
# The customer-guard test signs a real ES256 token, because the property it
# checks -- that a VALID customer token cannot reach an operator route -- cannot
# be observed with an invalid one. Already a dependency of this crate.
ring = { version = "0.17", default-features = false }
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
