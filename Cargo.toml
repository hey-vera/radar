[workspace]
resolver = "3"
members = ["crates/radar-types", "crates/radar-asof", "crates/radar-provider", "crates/radar-agent",
    "crates/radar-model", "crates/radar-decode", "crates/radar-store", "crates/radar-backfill", "crates/radar-cli", "crates/radar-instruments", "crates/radar-serve", "crates/radar-risk", "crates/radar-sim", "crates/radar-strategy", "crates/radar-research", "crates/radar-graph", "crates/radar-signer", "crates/radar-exec", "crates/radar-customer", "crates/radar-pumpfun", "crates/radar-onchain", "crates/radar-roast", "crates/radar-analyst", "crates/radar-contest", "crates/radar-payout", "crates/repo-conformance"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/hey-vera/radar"
homepage = "https://radar.heyvera.org"
authors = ["The Radar Authors"]

[workspace.dependencies]
radar-types = { path = "crates/radar-types", version = "0.0.1" }
radar-agent = { path = "crates/radar-agent", version = "0.0.1" }
radar-model = { path = "crates/radar-model", version = "0.0.1" }
radar-provider = { path = "crates/radar-provider", version = "0.0.1" }
radar-asof = { path = "crates/radar-asof", version = "0.0.1" }
radar-decode = { path = "crates/radar-decode", version = "0.0.1" }
radar-pumpfun = { path = "crates/radar-pumpfun", version = "0.0.1" }
radar-onchain = { path = "crates/radar-onchain", version = "0.0.1" }
radar-roast = { path = "crates/radar-roast", version = "0.0.1" }
radar-analyst = { path = "crates/radar-analyst", version = "0.0.1" }
radar-contest = { path = "crates/radar-contest", version = "0.0.1" }
radar-payout = { path = "crates/radar-payout", version = "0.0.1" }
radar-instruments = { path = "crates/radar-instruments", version = "0.0.1" }
radar-exec = { path = "crates/radar-exec", version = "0.0.1" }
radar-risk = { path = "crates/radar-risk", version = "0.0.1" }
radar-customer = { path = "crates/radar-customer", version = "0.0.1" }
radar-signer = { path = "crates/radar-signer", version = "0.0.1" }
radar-sim = { path = "crates/radar-sim", version = "0.0.1" }
radar-strategy = { path = "crates/radar-strategy", version = "0.0.1" }
radar-research = { path = "crates/radar-research", version = "0.0.1" }
radar-graph = { path = "crates/radar-graph", version = "0.0.1" }
radar-backfill = { path = "crates/radar-backfill", version = "0.0.1" }
radar-store = { path = "crates/radar-store", version = "0.0.1" }

# Kept deliberately small. Every dependency here is one more thing that can be
# compromised into a process that will eventually hold a signing key, so the bar
# for adding one is "the alternative is writing it ourselves and getting it wrong".
blake3 = "1.5"
ed25519-dalek = "3.0"
# OAuth 1.0a request signing, which is the only way to post as an account: X
# refuses `POST /2/tweets` from an app-only bearer token and requires user
# context (checked against docs.x.com, 2026-09-05).
#
# Two crates, and they were weighed against the bar above rather than added past
# it. HMAC-SHA1 is a fixed, published algorithm with RFC 2202 test vectors, so
# "write it ourselves" is genuinely available — and it is exactly the shape of
# thing the second half of that sentence is about. These come from the same
# RustCrypto family as `sha2`, whose `digest` and `crypto-common` are already in
# the tree, so the addition is a branch of a trusted lineage rather than a new
# one — and `digest` stays at a single version, which is the thing worth
# checking.
#
# **Four crates, not two.** `hmac` and `sha1` pull `cmov` and `ctutils` behind
# them. Counted after resolving rather than before, because the number that
# matters is the one in `Cargo.lock`.
#
# SHA-1 is broken for collision resistance and must never be used here for
# anything else. OAuth 1.0a specifies it, X requires it, and its use is confined
# to `radar_analyst::oauth`.
hmac = "0.13"
sha1 = "0.11"
# Already in the tree; named here so the version is one decision rather than
# whatever a transitive dependency happens to pick.
base64 = "0.23"
rand = "0.9"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic wants every product name in backticks. Rendering "Radar" as code in
# prose is worse documentation, not better.
doc_markdown = "allow"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
