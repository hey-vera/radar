[package]
name = "radar-decode"
description = "Local decoding of Solana program instructions. Discriminator bytes, never logged names; unknown is a value, never a guess."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
radar-types.workspace = true

[dev-dependencies]
# Test-only. The crate itself computes no hashes: the discriminator table is
# constant bytes captured from mainnet, and sha2 is here purely so a test can
# prove those constants match the Anchor naming convention they claim to follow.
bs58.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.10"

