# SPDX-License-Identifier: Apache-2.0
[package]
name = "radar-analyst"
description = "The summoned-reply loop: what a mention is allowed to say, who is allowed to ask, and what was actually posted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
radar-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The one impure edge in this crate: reading mentions and posting replies.
# Matched to the client every other crate here uses rather than adding a second
# HTTP stack to a workspace whose dependency bar is "the alternative is writing
# it ourselves and getting it wrong".
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true
