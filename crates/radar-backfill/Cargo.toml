[package]
name = "radar-backfill"
description = "Bulk historical extraction from CryptoHouse into Radar's store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
bs58.workspace = true
radar-asof.workspace = true
radar-decode.workspace = true
radar-store.workspace = true
radar-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Blocking HTTP. A batch extractor has no use for an async runtime, and pulling
# tokio in here would put it in the dependency tree of a process that only ever
# makes one request at a time.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true
