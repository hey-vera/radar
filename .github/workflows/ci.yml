# SPDX-License-Identifier: Apache-2.0
#
# Each job runs exactly one justfile recipe. The workflow contains no copy of the
# commands, so a check cannot mean one thing locally and another here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: [build, tests, lint, fmt, licence-headers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just ${{ matrix.recipe }}

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just web

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - run: just cargo-deny

  mutants-shards:
    # Sharded across four runners. The set is split, not sampled: every mutant
    # is still tested, and a shard that finds a survivor fails its own job.
    #
    # Serial, this job was killed part-way on every run of a forty-commit branch
    # and reported nothing -- which reads exactly like success.
    name: mutants-shards
    strategy:
      fail-fast: false
      matrix:
        # Zero-indexed: `--shard k/n` requires k < n, so 4/4 is a usage
        # error and 0/4 is a real shard. Written [1,2,3,4] first, which
        # failed shard 4 loudly *and skipped shard 0 silently* -- a quarter
        # of the mutants untested while the job looked merely broken.
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # A wedged job should fail as a timeout rather than as an unexplained
    # cancellation, which is a distinction this workflow has already cost a
    # session for want of.
    timeout-minutes: 30
    # Only on pull requests: `--in-diff` needs two sides to diff, and on a push
    # to main there is nothing to compare against that is not already merged.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--in-diff` diffs against the base, so the base has to be here.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-mutants
      # Reported so a job that dies mid-run says why. Shards were repeatedly
      # killed with no error and no exit code, which is indistinguishable
      # between a full disk, an out-of-memory kill and a cancelled run -- and
      # guessing wrong cost most of a session.
      - name: what this runner has
        run: |
          df -h / | tail -1
          free -m | head -2
      - run: just mutants origin/${{ github.base_ref }} ${{ matrix.shard }}/4
      - name: what is left of it
        if: always()
        run: df -h / | tail -1

  # The name the branch ruleset requires, kept as one context.
  #
  # A matrix job reports as `mutants (1)`, `mutants (2)` and so on, so sharding
  # the job under its own name would have deleted the required check rather than
  # satisfied it -- and a required check that no longer exists blocks every pull
  # request permanently.
  #
  # `if: always()` so this runs even when a shard fails; without it the job is
  # skipped, and a skipped required check is not a passing one.
  mutants:
    name: mutants
    runs-on: ubuntu-latest
    needs: mutants-shards
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: every shard passed
        run: |
          result='${{ needs.mutants-shards.result }}'
          echo "shards: $result"
          # `success` is the only acceptable answer. `skipped` and `cancelled`
          # are failures here: this check exists to say the mutants were tested,
          # and neither of those means they were.
          test "$result" = success

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The rust-version in Cargo.toml is a promise to anyone depending on these
      # crates. A promise nothing checks is a promise that quietly breaks.
      - uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --all-targets --locked
