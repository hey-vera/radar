[package]
name = "radar-exec"
description = "Route, gate, sign, submit, reconcile. The last stage, and the one holding the least authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
radar-risk.workspace = true
radar-signer.workspace = true
radar-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
# The composition test only. Nothing in this crate's own source depends on the
# strategy or the simulator -- the direction of the dependency matters, and a
# dev-dependency keeps the production graph unchanged while letting the lane be
# exercised from the top.
radar-asof.workspace = true
radar-sim.workspace = true
radar-strategy.workspace = true

[lints]
workspace = true
